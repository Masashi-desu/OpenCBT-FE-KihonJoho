name: Deploy OpenCBT to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      profile: ${{ steps.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci/base-evidence.mjs output/ci/base-evidence.json
          node scripts/ci/plan.mjs output/ci/plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: verification-plan-${{ github.run_attempt }}
          path: |
            output/ci/plan.json
            output/ci/base-evidence.json
          if-no-files-found: error
  tests:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: verification-plan-${{ github.run_attempt }}
          path: output/ci
      - run: npm run pretest
      - name: Run planned tests
        run: node scripts/ci/run-part.mjs output/ci/plan.json ${{ matrix.part }} output/ci/results/${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results-${{ github.run_attempt }}-${{ matrix.part }}
          path: output/ci/results/${{ matrix.part }}
          if-no-files-found: error
  aggregate:
    needs: [plan, tests]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: verification-plan-${{ github.run_attempt }}
          path: output/ci
      - uses: actions/download-artifact@v4
        with:
          pattern: verification-results-${{ github.run_attempt }}-*
          path: output/ci/downloaded
      - name: Require successful matrix and complete witnesses
        env:
          TEST_JOB_RESULT: ${{ needs.tests.result }}
        run: |
          test "$TEST_JOB_RESULT" = success
          node scripts/ci/aggregate.mjs output/ci/plan.json output/ci/downloaded
  build:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run doc:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: [build, aggregate]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
