<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ハフマン符号化とデータ圧縮</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="scrollbars.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1 id="standalone-title" hidden>ハフマン符号化とデータ圧縮</h1>
  <p id="error" role="alert" hidden></p>
  <section id="lesson" aria-label="ハフマン符号化のステップ">
    <section class="source" aria-labelledby="source-title">
      <div>
        <h2 id="source-title">問題の符号表</h2>
        <p>5種類の文字でできた通信データをハフマン符号化で圧縮します。表の空欄 <var>a</var> に入る、Dの符号を求めます。</p>
      </div>
      <div class="source-scroll">
        <table class="source-table" aria-labelledby="source-title">
          <thead><tr id="source-symbols"><th scope="col">文字</th></tr></thead>
          <tbody>
            <tr id="source-weights"><th scope="row">出現頻度</th></tr>
            <tr id="source-codes"><th scope="row">符号</th></tr>
          </tbody>
        </table>
      </div>
    </section>
    <div id="diagram" class="diagram">
      <div class="tree-scroll" tabindex="0" role="group" aria-label="ハフマン木。節を選ぶと頻度や符号を確認できます">
        <div id="tree" class="tree">
          <svg id="edges" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        </div>
      </div>
    </div>
    <div class="navigation" role="group" aria-label="ステップ操作">
      <button id="prev" type="button">戻る</button>
      <span id="counter" aria-hidden="true"></span>
      <input id="seek" type="range" min="0" value="0" aria-label="ステップ">
      <button id="next" type="button">次へ</button>
    </div>
    <div class="explanation">
      <div role="status" aria-atomic="true">
        <h2 id="step-title"></h2>
        <p id="formula" class="formula" hidden></p>
        <p id="step-note"></p>
      </div>
      <div id="comparison" class="choices" role="group" aria-label="問題の選択肢を試す" hidden></div>
      <div id="example" hidden>
        <div id="chunks" class="chunks" role="group" aria-label="ABCDEを置き換えた符号列"></div>
      </div>
      <div id="totals" hidden>
        <div id="terms" class="terms" role="group" aria-label="文字ごとの出現回数×符号長"></div>
        <dl id="bars" class="bars">
          <div><dt>固定長</dt><dd><span id="fixed-bar" class="bar" aria-hidden="true"></span><span id="fixed-bits"></span></dd></div>
          <div><dt>ハフマン符号</dt><dd><span id="huffman-bar" class="bar" aria-hidden="true"></span><span id="huffman-bits"></span></dd></div>
        </dl>
      </div>
    </div>
  </section>
  <p id="standalone-credit" class="credit" hidden>出典は平成30年度 秋期 基本情報技術者試験 午前 問4（p.4）。©2018 独立行政法人情報処理推進機構（IPA）。問題の条件を基に作図・解説。独自の図と解説はCC0-1.0、コードはMIT。<a href="https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_fe_am_qs.pdf#page=4">公式問題</a>・<a href="https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000f01f-att/2018h30a_fe_am_ans.pdf">公式解答例</a></p>
</main>
<script src="huffman-engine.js"></script>
<script src="scrollbars.js"></script>
<script src="main.js"></script>
</body>
</html>
